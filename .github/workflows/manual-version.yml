name: Manual Version

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump type
        required: true
        type: choice
        options:
          - major
          - minor
          - patch

permissions:
  contents: write

jobs:
  release:
    name: Manual version bump
    uses: ./.github/workflows/version-bump.yml
    with:
      bump: ${{ inputs.bump }}
