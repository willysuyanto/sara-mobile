name: Auto Version

on:
  pull_request:
    types:
      - closed

permissions:
  contents: write

concurrency:
  group: version-bump
  cancel-in-progress: false

jobs:
  resolve-bump:
    name: Resolve version bump
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      bump: ${{ steps.bump.outputs.type }}
    steps:
      - name: Resolve bump type from branch
        id: bump
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          case "${BRANCH}" in
            feat/*|feature/*) type="minor" ;;
            chore/*|bugfix/*|fix/*|refactor/*|perf/*|style/*) type="patch" ;;
            *) type="" ;;
          esac
          echo "type=${type}" >> "${GITHUB_OUTPUT}"

  release:
    name: Auto version bump
    needs: resolve-bump
    if: needs.resolve-bump.outputs.bump != ''
    uses: ./.github/workflows/version-bump.yml
    with:
      bump: ${{ needs.resolve-bump.outputs.bump }}
